# SBOM+ (sbomplus/) CI. Separate from ci.yml on purpose: the core workflow is owned by the core package.
# NOT yet run on GitHub (written locally): the same two commands pass locally with all network faked.
# PYTHONUTF8=1 is required on Windows (the core CLI prints non-cp949 characters; see docs/CORE_ISSUES.md item 4).
name: sbomplus CI

on:
  push:
    paths:
      - "sbomplus/**"
      - "bts_sbom/**"
      - "tests/sbomplus/**"
      - "specs/**"
      - "knowledge/**"
      - "evals/**"
      - "pyproject.toml"
      - ".github/workflows/sbomplus_ci.yml"
  pull_request:
    paths:
      - "sbomplus/**"
      - "bts_sbom/**"
      - "tests/sbomplus/**"
      - "specs/**"
      - "knowledge/**"
      - "evals/**"
      - "pyproject.toml"
      - ".github/workflows/sbomplus_ci.yml"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the repository (stdlib only) and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: SBOM+ tests (network faked)
        run: python -m pytest -q -p no:cacheprovider tests/sbomplus
      - name: Spec lint (EARS shape + AC <-> test traceability)
        run: python -m sbomplus.speclint
      - name: Retrieval + chatbot grounding eval (no network, no LLM)
        run: python -I -X utf8 run_sbomplus.py evalrag
