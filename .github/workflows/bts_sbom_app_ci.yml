# BTS-SBOM (bts_sbom_app/) CI. Separate from ci.yml on purpose: the core workflow is owned by the core package.
# NOT yet run on GitHub (written locally): the same two commands pass locally with all network faked.
# PYTHONUTF8=1 is kept as a safety net on Windows; since 0.2.0 the core CLI also works without it (docs/CORE_ISSUES.md item 4).
name: BTS-SBOM app CI

on:
  push:
    paths:
      - "bts_sbom_app/**"
      - "bts_sbom/**"
      - "tests/bts_sbom_app/**"
      - "specs/**"
      - "knowledge/**"
      - "evals/**"
      - "pyproject.toml"
      - ".github/workflows/bts_sbom_app_ci.yml"
  pull_request:
    paths:
      - "bts_sbom_app/**"
      - "bts_sbom/**"
      - "tests/bts_sbom_app/**"
      - "specs/**"
      - "knowledge/**"
      - "evals/**"
      - "pyproject.toml"
      - ".github/workflows/bts_sbom_app_ci.yml"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the repository (stdlib only) and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: BTS-SBOM tests (network faked)
        run: python -m pytest -q -p no:cacheprovider tests/bts_sbom_app
      - name: Secret scan (stdlib regex, file:line:rule only, never the value)
        run: python -I tools/secret_scan.py .
      - name: Spec lint (EARS shape + AC <-> test traceability)
        run: python -m bts_sbom_app.speclint
      - name: Doc lint (ADR, governance, runbook, enforcement map)
        run: python -m bts_sbom_app.doclint --strict
      - name: Retrieval + chatbot grounding eval (no network, no LLM)
        run: python -I -X utf8 run_bts_sbom_app.py evalrag
