# Azure Container Apps 정의 (deploy/azure/containerapp.yaml) — bts-sbom-app
# 배포: deploy/azure/README.md 의 az CLI 절차를 따른다. 이 YAML은 `az containerapp create --yaml` 또는
# 검토용 선언으로 쓴다. 실측 근거: deploy/kind/bts-sbom.yaml(로컬 검증)과 동일한 리소스·프로브·단일 레플리카.
# 주의: 이 서비스는 계정이 없다. public ingress에는 (1) Easy Auth(AAD) 또는 (2) 앱 자체 공유 토큰 게이트
# BTS_SBOM_ACCESS_TOKEN(access.py: /healthz·/readyz 외 모든 경로가 Basic 비밀번호/Bearer/X-BTS-Token을 요구) 중 하나가 필요하다 (docs/AZURE_DEPLOYMENT.md §1).
# 거버넌스 태그(team/week/owner, 과제4/5_가이드 §09 비용 안전 수칙)와 예산 경보 50/80/100% dry-run 명령은
# scripts/azure_budget.py --dry-run 으로 만든다(az는 절대 직접 실행하지 않음) — README §9.
tags:
  team: "bts-sbom"
  week: "<ISO week of this redeploy, e.g. 2026-W48>"
  owner: "<on-call contact: email or chat handle>"
properties:
  environmentInfo: null          # az containerapp env 가 채움 (managedEnvironment id)
  configuration:
    activeRevisionsMode: single
    ingress:
      external: true             # Easy Auth(AAD) 활성 전까지는 false(internal)로 유지할 것
      targetPort: 8800
      transport: auto            # SSE(/api/chat/stream) 스트림 허용
      allowInsecure: false
    secrets:
      - name: azure-api-key
        value: "<AZURE_OPENAI_KEY — az keyvault 또는 수동 입력>"
      - name: azure-base-url
        value: "https://<resource>.openai.azure.com"
      - name: azure-deployment
        value: "gpt-5-mini"
      - name: azure-api-version
        value: "2025-04-01-preview"
      - name: access-token
        value: "<python -m bts_sbom_app access-token 으로 만든 값 — 로그·레포에 남기지 말 것>"
    services: null
  template:
    containers:
      - name: bts-sbom-app
        image: "<REGISTRY>/bts-sbom-app:8.1.0"   # Dockerfile.bts-sbom-app 빌드 결과
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: BTS_OSS_ALLOWED_HOSTS
            value: "<app FQDN, 예: bts-sbom.<env>.azurecontainerapps.io>"
          - name: BTS_SBOM_LLM_DAILY_BUDGET
            value: "80"
          - name: BTS_SBOM_UNICODE
            value: "1"
          - name: BTS_SBOM_TRUST_FORWARDED           # the Container Apps ingress is the TCP peer: its X-Forwarded-For (last entry) identifies the caller
            value: "1"
          - name: BTS_SBOM_ALLOWED_ROOTS             # local-path / file:// sources are refused outside this folder (workspace.py): the
            value: "/srv/bts-sources"                # folder does not exist in the image, so only git URLs can be analysed on the public service
          - name: AZURE_OPENAI_API_KEY
            secretRef: azure-api-key
          - name: AZURE_OPENAI_BASE_URL
            secretRef: azure-base-url
          - name: AZURE_OPENAI_DEPLOYMENT
            secretRef: azure-deployment
          - name: AZURE_OPENAI_API_VERSION
            secretRef: azure-api-version
          - name: BTS_SBOM_ACCESS_TOKEN
            secretRef: access-token
        # parity with the proven live declaration (deploy/azure/containerapp.applied.yaml, revision
        # bts-sbom--0000003): 3 probes of distinct type, same paths/port as the applied config and the
        # kind manifest (deploy/kind/bts-sbom.yaml). targetPort above is 8800 - every probe port below MUST
        # match it; tests/bts_sbom_app/test_azure_redeploy.py fails if any of the 3 drifts.
        probes:
          - type: Startup
            httpGet:
              path: /readyz
              port: 8800
              scheme: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          - type: Liveness
            httpGet:
              path: /healthz
              port: 8800
              scheme: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          - type: Readiness
            httpGet:
              path: /readyz
              port: 8800
              scheme: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
        volumeMounts:
          - volumeName: evidence-files
            mountPath: /tmp/evidence
            subPath: evidence
    volumes:
      - name: evidence-files
        storageType: AzureFile
        storageName: evidence-files        # az containerapp env storage-scale/set (README §3)
    scale:
      minReplicas: 1                       # 단일 프로세스·evidence 공유 계약 — 0 스케일 배제
      maxReplicas: 1
